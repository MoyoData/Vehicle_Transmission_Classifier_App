global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/ml_alerts.yml"

scrape_configs:
  - job_name: 'ml_app'
    scrape_interval: 5s
    static_configs:
      - targets: ['ml_app:5001']
    metrics_path: '/metrics'
   

  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'model-training'
    scrape_interval: 5s
    static_configs:
      - targets:
        - 'training-metrics:8002'
    metrics_path: /metrics
    scheme: http
    scrape_timeout: 3s